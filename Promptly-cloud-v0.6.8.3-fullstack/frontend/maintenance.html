<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promptly - 系统维护中</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      width: 100%;
      padding: 60px 40px;
      text-align: center;
      animation: fadeIn 0.5s ease-in;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 30px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
    }

    .icon svg {
      width: 60px;
      height: 60px;
      fill: white;
    }

    h1 {
      font-size: 32px;
      color: #2d3748;
      margin-bottom: 16px;
      font-weight: 700;
    }

    .subtitle {
      font-size: 18px;
      color: #718096;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .info-box {
      background: #f7fafc;
      border-radius: 12px;
      padding: 24px;
      margin: 32px 0;
      border-left: 4px solid #667eea;
    }

    .info-item {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 12px 0;
      color: #4a5568;
      font-size: 16px;
    }

    .info-item svg {
      width: 20px;
      height: 20px;
      margin-right: 12px;
      fill: #667eea;
    }

    .status-badge {
      display: inline-block;
      background: #fef5e7;
      color: #f39c12;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .footer {
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid #e2e8f0;
      color: #a0aec0;
      font-size: 14px;
    }

    .footer a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .container {
        padding: 40px 24px;
      }

      h1 {
        font-size: 24px;
      }

      .subtitle {
        font-size: 16px;
      }

      .icon {
        width: 100px;
        height: 100px;
      }

      .icon svg {
        width: 50px;
        height: 50px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
      </svg>
    </div>

    <div class="status-badge">🔧 系统维护中</div>

    <h1>我们正在进行系统升级</h1>
    <p class="subtitle">
      为了给您提供更好的服务体验，我们正在进行必要的系统维护和优化。<br>
      感谢您的耐心等待。
    </p>

    <div class="info-box">
      <div class="info-item">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/>
        </svg>
        <span>预计恢复时间：<strong id="estimatedTime">约 2 小时后</strong></span>
      </div>
      <div class="info-item">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
        </svg>
        <span>有问题？联系我们：<strong>support@promptly.com</strong></span>
      </div>
    </div>

    <div class="footer">
      <p>维护期间，您的数据是安全的。</p>
      <p style="margin-top: 8px;">
        访问 <a href="https://status.promptly.com" target="_blank">系统状态页面</a> 获取实时更新
      </p>
    </div>
  </div>

  <script>
    // 可选：自动刷新检测维护是否结束
    // 每隔 60 秒检查一次后端状态
    setInterval(() => {
      fetch('/api/health')
        .then(res => {
          if (res.ok) {
            // 后端恢复了，刷新页面
            window.location.reload();
          }
        })
        .catch(() => {
          // 仍在维护中，继续等待
        });
    }, 60000); // 60秒检查一次

    // 显示当前时间
    function updateTime() {
      const now = new Date();
      const options = { 
        year: 'numeric', 
        month: 'long', 
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      };
      document.getElementById('currentTime').textContent = now.toLocaleString('zh-CN', options);
    }
    
    // 每秒更新一次时间（如果需要的话）
    // setInterval(updateTime, 1000);
  </script>
</body>
</html>
