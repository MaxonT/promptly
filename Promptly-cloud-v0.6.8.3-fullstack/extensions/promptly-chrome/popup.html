<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Promptly</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #101a34;
      --panel-2: #0f1830;
      --text: #e5ebff;
      --muted: #94a3b8;
      --line: #2b3a62;
      --primary: #22d3ee;
      --primary-2: #7c3aed;
      --danger: #ef4444;
      --ok: #22c55e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      width: 420px;
      min-height: 620px;
      background: radial-gradient(circle at top, #14234d 0%, var(--bg) 48%);
      color: var(--text);
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      padding: 10px;
    }

    .title {
      font-size: 15px;
      font-weight: 700;
      margin: 0;
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
    }

    .space {
      justify-content: space-between;
    }

    .status {
      font-size: 12px;
      color: var(--muted);
    }

    .status.ok { color: var(--ok); }
    .status.error { color: #fca5a5; }

    textarea,
    select,
    button {
      font: inherit;
    }

    textarea,
    select {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(10, 15, 30, 0.9);
      color: var(--text);
      border-radius: 10px;
      padding: 8px;
      outline: none;
    }

    textarea:focus,
    select:focus {
      border-color: var(--primary);
    }

    textarea {
      resize: vertical;
      min-height: 88px;
      max-height: 180px;
    }

    textarea[readonly] {
      min-height: 108px;
    }

    button {
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      font-weight: 600;
    }

    button.secondary {
      background: rgba(15, 23, 42, 0.7);
      border-color: var(--line);
      color: var(--text);
      font-weight: 500;
    }

    button.warn {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fecaca;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 170px;
      overflow: auto;
      margin-top: 8px;
      padding-right: 2px;
    }

    .history-item {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px;
      background: rgba(9, 13, 26, 0.85);
    }

    .history-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .history-meta {
      color: var(--muted);
      font-size: 11px;
    }

    .history-input {
      color: #cbd5e1;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
    }

    .history-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .history-actions button {
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 8px;
    }

    .empty {
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      padding: 10px 0;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="panel">
      <h1 class="title">Promptly</h1>
      <p class="subtitle">Vibe Coding prompts, optimized with Promptly Pipeline.</p>
      <div class="row space">
        <span id="authStatus" class="status">Account not connected</span>
        <button id="connectBtn" class="secondary">Connect Promptly Account</button>
      </div>
      <div id="runtimeStatus" class="status" style="margin-top:8px;"></div>
    </section>

    <section class="panel">
      <label for="modelSelect" class="subtitle" style="display:block;margin-bottom:6px;">Optimization Mode</label>
      <select id="modelSelect">
        <option value="fast">Fast</option>
        <option value="standard">Standard</option>
        <option value="premium">Premium</option>
      </select>

      <label for="inputPrompt" class="subtitle" style="display:block;margin:10px 0 6px;">Raw Prompt</label>
      <textarea id="inputPrompt" placeholder="Paste your messy prompt idea here..."></textarea>

      <div class="row">
        <button id="optimizeBtn" style="flex:1;">Optimize</button>
        <button id="copyBtn" class="secondary" disabled>Copy</button>
        <button id="saveBtn" class="secondary" disabled>Save</button>
      </div>

      <label for="outputPrompt" class="subtitle" style="display:block;margin:10px 0 6px;">Optimized Prompt</label>
      <textarea id="outputPrompt" readonly placeholder="Your optimized result will appear here."></textarea>
    </section>

    <section class="panel">
      <div class="row space" style="margin-top:0;">
        <span class="title" style="font-size:13px;">History</span>
        <button id="clearHistoryBtn" class="warn">Clear</button>
      </div>
      <div id="historyList" class="history-list"></div>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
