name: ci
on: [push, pull_request]
jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Backend install and test
        run: |
          cd backend
          npm install
          npm run health
      - name: Backend lint check
        run: |
          cd backend
          npm ls || true

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Frontend build test
        run: |
          cd frontend
          npm install
          npm run build
      - name: Check config generation
        run: |
          cd frontend
          ls -la config.js || echo "config.js not found (expected in CI)"

  integration-check:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Version consistency check
        run: |
          BACKEND_VERSION=$(node -p "require('./backend/package.json').version")
          FRONTEND_VERSION=$(node -p "require('./frontend/package.json').version")
          echo "Backend version: $BACKEND_VERSION"
          echo "Frontend version: $FRONTEND_VERSION"
          if [ "$BACKEND_VERSION" != "$FRONTEND_VERSION" ]; then
            echo "❌ Version mismatch detected!"
            exit 1
          else
            echo "✅ Version consistency confirmed"
          fi
      - name: File structure validation
        run: |
          # Check critical files exist
          test -f backend/src/server.js || (echo "Missing server.js" && exit 1)
          test -f frontend/build.js || (echo "Missing build.js" && exit 1)
          test -f frontend/vercel.json || (echo "Missing vercel.json" && exit 1)
          echo "✅ Critical files validation passed"
