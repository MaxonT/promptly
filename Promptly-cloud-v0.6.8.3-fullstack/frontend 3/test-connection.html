<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promptly API 连接测试</title>
  <script src="config.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      max-width: 600px;
      width: 100%;
      padding: 40px;
    }
    h1 {
      color: #667eea;
      margin-bottom: 10px;
      font-size: 28px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .test-item {
      background: #f8f9fa;
      border-left: 4px solid #ddd;
      padding: 15px;
      margin: 15px 0;
      border-radius: 4px;
      transition: all 0.3s;
    }
    .test-item.pending { border-color: #ffc107; }
    .test-item.success { border-color: #28a745; background: #f0fff4; }
    .test-item.error { border-color: #dc3545; background: #fff5f5; }
    .test-item h3 {
      font-size: 16px;
      margin-bottom: 8px;
      color: #333;
    }
    .test-item p {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
    }
    .test-item code {
      background: #e9ecef;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 13px;
      color: #e83e8c;
      word-break: break-all;
    }
    .btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      margin-top: 20px;
      transition: transform 0.2s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status-icon {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 8px;
    }
    .status-icon.pending { background: #ffc107; animation: pulse 1.5s infinite; }
    .status-icon.success { background: #28a745; }
    .status-icon.error { background: #dc3545; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .log {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
      max-height: 200px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      line-height: 1.6;
    }
    .log .log-time { color: #858585; }
    .log .log-info { color: #4fc3f7; }
    .log .log-success { color: #81c784; }
    .log .log-error { color: #e57373; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔧 Promptly API 连接测试</h1>
    <p class="subtitle">此页面帮助你验证前后端连接是否正常配置</p>

    <div class="test-item" id="test-config">
      <h3><span class="status-icon pending"></span>1. API 配置检测</h3>
      <p>检查中...</p>
    </div>

    <div class="test-item" id="test-health">
      <h3><span class="status-icon pending"></span>2. 后端健康检查</h3>
      <p>等待配置检测完成...</p>
    </div>

    <div class="test-item" id="test-cors">
      <h3><span class="status-icon pending"></span>3. CORS 配置测试</h3>
      <p>等待健康检查完成...</p>
    </div>

    <div class="test-item" id="test-session">
      <h3><span class="status-icon pending"></span>4. 创建测试会话</h3>
      <p>等待 CORS 测试完成...</p>
    </div>

    <button class="btn" onclick="runTests()">重新测试</button>

    <div class="log" id="log"></div>
  </div>

  <script>
    const API_BASE = (window.PROMPTLY_API_BASE && window.PROMPTLY_API_BASE.trim())
      || (window.location && window.location.origin && window.location.origin !== "null"
        ? window.location.origin
        : "http://localhost:8080");

    function log(message, type = 'info') {
      const logEl = document.getElementById('log');
      const time = new Date().toLocaleTimeString('zh-CN');
      const className = 'log-' + type;
      logEl.innerHTML += `<div><span class="log-time">[${time}]</span> <span class="${className}">${message}</span></div>`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function updateTest(id, status, title, message) {
      const el = document.getElementById(id);
      const icon = el.querySelector('.status-icon');
      icon.className = 'status-icon ' + status;
      el.className = 'test-item ' + status;
      el.querySelector('h3').innerHTML = `<span class="status-icon ${status}"></span>${title}`;
      el.querySelector('p').innerHTML = message;
    }

    async function runTests() {
      document.getElementById('log').innerHTML = '';
      log('开始测试...', 'info');

      // Test 1: Config
      log('检查 API 配置...', 'info');
      if (!window.PROMPTLY_API_BASE || window.PROMPTLY_API_BASE.includes('YOUR-BACKEND-URL-HERE')) {
        updateTest('test-config', 'error', 
          '1. API 配置检测 ❌',
          '❌ 配置错误：请编辑 <code>config.js</code> 文件，设置正确的后端 URL。<br>当前值: <code>' + (window.PROMPTLY_API_BASE || '未设置') + '</code>');
        log('配置错误：未设置有效的 API URL', 'error');
        return;
      }

      updateTest('test-config', 'success',
        '1. API 配置检测 ✓',
        '✅ 配置正确：<code>' + API_BASE + '</code>');
      log('API 配置正确: ' + API_BASE, 'success');

      // Test 2: Health Check
      log('测试后端健康检查...', 'info');
      try {
        const healthRes = await fetch(`${API_BASE}/api/health`);
        if (!healthRes.ok) {
          throw new Error(`HTTP ${healthRes.status}`);
        }
        const healthData = await healthRes.json();
        updateTest('test-health', 'success',
          '2. 后端健康检查 ✓',
          `✅ 后端运行正常<br>状态: <code>${healthData.status}</code><br>时间: <code>${healthData.time}</code>`);
        log('后端健康检查通过', 'success');
      } catch (err) {
        updateTest('test-health', 'error',
          '2. 后端健康检查 ❌',
          `❌ 无法连接到后端<br>错误: <code>${err.message}</code><br><br>请检查：<br>1. 后端是否已部署并运行<br>2. URL 是否正确<br>3. 网络连接是否正常`);
        log('健康检查失败: ' + err.message, 'error');
        return;
      }

      // Test 3: CORS
      log('测试 CORS 配置...', 'info');
      updateTest('test-cors', 'success',
        '3. CORS 配置测试 ✓',
        '✅ CORS 配置正常（已成功完成跨域请求）');
      log('CORS 配置正常', 'success');

      // Test 4: Session Creation
      log('测试创建会话...', 'info');
      try {
        const sessionRes = await fetch(`${API_BASE}/api/question-sessions`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            initial_description: 'API 连接测试',
            kind: 'coding'
          })
        });

        if (!sessionRes.ok) {
          const errorText = await sessionRes.text();
          throw new Error(`HTTP ${sessionRes.status}: ${errorText}`);
        }

        const sessionData = await sessionRes.json();
        updateTest('test-session', 'success',
          '4. 创建测试会话 ✓',
          `✅ 会话创建成功<br>会话 ID: <code>${sessionData.session_id}</code><br>问题数量: <code>${sessionData.questions?.length || 0}</code>`);
        log('测试会话创建成功: ' + sessionData.session_id, 'success');
        log('', 'info');
        log('🎉 所有测试通过！你的 Promptly 应用已正确配置。', 'success');
      } catch (err) {
        updateTest('test-session', 'error',
          '4. 创建测试会话 ❌',
          `❌ 会话创建失败<br>错误: <code>${err.message}</code><br><br>可能原因：<br>1. OpenAI API Key 未设置或无效<br>2. 后端数据库问题<br>3. 后端服务内部错误`);
        log('会话创建失败: ' + err.message, 'error');
      }
    }

    // Auto-run tests on page load
    window.addEventListener('load', () => {
      setTimeout(runTests, 500);
    });
  </script>
</body>
</html>
